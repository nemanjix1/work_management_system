{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'departments/css/login.css' %}">
</head>
<body>
    <div class="login-card">
        <div class="logo">

        </div>
        <h1>SimGroup d.o.o.</h1>
        
         <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label> Korisnicko ime</label>
            {{form.username}}
        </div>
        <div class="form-group">
            <label>Lozinka</label>
            {{form.password}}
        </div>
        <button type="submit">
            Prijavi se
        </button>
        {{ form.errors }}
    </form>  
    <p class="subtitle">
            Evidencija rada-Projekti-Zadaci-Greske
        </p> 
    </div>
     
</body>
</html>
